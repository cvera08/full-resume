<!DOCTYPE html>
<html lang="{{ site.lang | default: "en" }}">
  <head>
    {%- include head.html %}
  </head>

  <body>
    {{ content }}
    <script>
      if (new URLSearchParams(window.location.search).has('print')) {
        window.addEventListener('load', function() {
          setTimeout(function() { window.print(); }, 800);
        });
      }
    </script>
  </body>
</html>
