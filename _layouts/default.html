<!DOCTYPE html>
<html lang="{{ site.lang | default: "en" }}">
  <head>
    {%- include head.html %}
  </head>

  <body>
    {{ content }}
    <a class="download-pdf-btn" href="{{ site.baseurl }}/assets/downloads/carlos-vera-resume.pdf" download="Carlos-Vera-Resume.pdf">&#8659;&nbsp;Download PDF</a>
    <script>
      if (new URLSearchParams(window.location.search).has('print')) {
        window.addEventListener('load', function() {
          setTimeout(function() { window.print(); }, 800);
        });
      }
    </script>
  </body>
</html>
